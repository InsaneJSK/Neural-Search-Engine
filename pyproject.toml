[project]
name = "neural-search-engine"
version = "0.1.0"
description = "Live web search ranked by trained BERT retrieval models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.5,<5",
    "ddgs>=9,<10",
    "kagglehub>=1.0.2",
    "mcp>=1.30,<2",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "safetensors>=0.6,<1",
    "starlette>=0.46,<1",
    "torch>=2.6,<3",
    "tqdm>=4.68.2",
    "transformers>=4.57,<5",
    "uvicorn>=0.34,<1",
]

# Install CPU PyTorch for the local inference runtime.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
